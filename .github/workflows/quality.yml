name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate non-breaking dependency repair candidate
        run: npm audit fix

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: TypeScript and production build
        run: npm run build

      - name: Commit patched dependency lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'review-3-upgrade-2026-11-14' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: update vulnerable dependency lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
