name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate non-breaking dependency repair candidate
        run: |
          npm audit fix
          npm pkg set 'overrides.minimatch=^11.0.8'
          npm install --package-lock-only
        continue-on-error: true

      - name: Upload dependency repair candidate for review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-fix-candidate
          path: |
            package.json
            package-lock.json
          if-no-files-found: error

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: TypeScript and production build
        run: npm run build
